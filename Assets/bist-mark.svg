<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="bist-title bist-description">
  <title id="bist-title">bist</title>
  <desc id="bist-description">Two opposing rounded orange arcs form a compact orbit with open diagonal space.</desc>
